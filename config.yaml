# ============================================================
# Embodied arXiv Radar - Configuration
# ------------------------------------------------------------
# Forkers: copy this file, edit categories/keywords/prompts to
# target your own research field (NLP, theory, vision, etc.)
# ============================================================

arxiv:
  # arXiv categories to scan. cs.RO is primary (all papers kept).
  # Non-primary categories require at least one keyword hit.
  categories:
    primary:
      - cs.RO          # Robotics — keep all
    secondary:
      - cs.AI
      - cs.CV
      - cs.LG

  # Keywords applied to title + abstract of secondary-category papers.
  # Case-insensitive substring match.
  keywords:
    - embodied
    - VLA
    - vision-language-action
    - manipulation
    - robot learning
    - robotic
    - sim2real
    - sim-to-real
    - world model
    - world action model
    - diffusion policy
    - imitation learning
    - behavior cloning
    - humanoid
    - dexterous
    - grasping
    - navigation
    - locomotion
    - quadruped
    - whole-body control
    - tactile
    - teleoperation
    - mobile manipulation
    # 3D-foundation track (VGGT-style, scene representation)
    - 3D foundation
    - scene representation
    - visual geometry
    - feature field
    - foundation model for robot
    - 3D Gaussian for robot

  # How many days back to look. 2 covers weekend release gaps.
  lookback_days: 2

  # Hard cap on candidates fetched per category. Keep ≤100 to stay on a
  # single page — arXiv rate-limits aggressively on multi-page fetches.
  max_per_category: 100


# ============================================================
# DeepSeek scoring + summarization
# ============================================================
scoring:
  model: deepseek-chat            # DeepSeek V4 chat endpoint
  max_published: 25               # Hard cap on papers per day

  # Two-tier quality bar:
  #  - priority_topics get the lower threshold (we want more of these)
  #  - everything else needs a higher score to make the cut
  priority_topics:
    - VLA
    - world-model
    - 3d-foundation
    - policy-learning
  priority_min_score: 6.0
  non_priority_min_score: 7.5

  # Deprecated — kept for backward compat with old code paths
  min_score: 6.0

  # Generate a daily AI briefing on top of the date page (~1 LLM call)
  briefing: true


# ============================================================
# Framework figure extraction
# ============================================================
figure:
  # Multimodal fallback for ambiguous figure selection.
  # If True, ambiguous cases call vl_model (extra cost ~$0.003/paper).
  # If False, always pick the heuristic top-1 (free).
  # NOTE: DeepSeek's VL API availability may vary; set False if you
  # don't have access. The heuristic alone is ~80% accurate.
  enable_vl_fallback: false
  vl_model: deepseek-chat         # Override when DeepSeek-VL is available
  min_figure_kb: 5                # Skip tiny images (likely logos)


# ============================================================
# Site
# ============================================================
site:
  title: "embodied-arxiv"
  description: "每日 arXiv 具身智能论文 · DeepSeek 摘要 + Trick + 框架图"
  language: zh
  history_days_on_index: 60        # Show last N days on homepage
