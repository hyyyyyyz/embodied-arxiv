name: Daily arXiv Digest

on:
  schedule:
    # 02:00 UTC = 10:00 Beijing. arXiv releases new papers ~01:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    # Auto-commits from GITHUB_TOKEN don't re-trigger workflows (GitHub
    # built-in protection), so no infinite loop. The paths-ignore below
    # adds a second safety net for any future PAT-based push.
    paths-ignore:
      - 'data/seen.json'
      - 'docs/papers/**'
      - 'docs/assets/figures/**'
      - 'docs/index.md'

permissions:
  contents: write           # to push the new digest back to main
  pages: write              # to deploy to Pages
  id-token: write           # OIDC for deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so we can push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/run.py

      - name: Commit new digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if ! git diff --staged --quiet; then
            git commit -m "📰 Daily digest $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new digest to commit."
          fi

      - name: Build site (MkDocs Material)
        # No --strict: awesome-pages + not_in_nav glob don't always interact
        # cleanly, and we'd rather ship a slightly noisy build than fail.
        run: mkdocs build -v

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
