site_name: embodied-arxiv
site_description: 每日 arXiv 具身智能论文 · DeepSeek 摘要 + Trick + 框架图
site_url: https://hyyyyyyz.github.io/embodied-arxiv/
repo_url: https://github.com/hyyyyyyz/embodied-arxiv
repo_name: hyyyyyyz/embodied-arxiv
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    # No navigation.tabs — we want left sidebar with date list, not top tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.expand     # auto-expand date list in sidebar
    - navigation.indexes    # date folder's index.md is the landing
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-pages:
      collapse_single_pages: false
      strict: false

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hyyyyyyz/embodied-arxiv
  generator: false

extra_css:
  - assets/stylesheets/extra.css

# Hide per-paper detail pages from nav (only date folders show their index.md).
# arXiv IDs always start with a digit; index.md does not.
not_in_nav: |
  /papers/*/[0-9]*.md
